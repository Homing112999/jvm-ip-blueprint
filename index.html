<!doctype html>
<html lang="zh-HK">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>JVM IP 拍攝藍圖</title>
<meta name="description" content="答 7 條問題，睇下 JVM 點樣幫你嘅品牌拍出 IP 短片。">
<meta name="theme-color" content="#141A22">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="JVM IP">
<meta name="apple-mobile-web-app-status-bar-style" content="black">

<meta property="og:title" content="JVM IP 拍攝藍圖">
<meta property="og:description" content="答 7 條問題，AI 即時整理 JVM 為你度身嘅品牌 IP 短片方案。">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+HK:wght@400;500;700;900&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
:root{
  --ground:#EEF0F3; --paper:#FFFFFF; --ink:#141A22; --muted:#5A6472; --line:#D6DBE2;
  --soft:#F5F6F8; --rec:#E0392C; --tape:#F2C23E; --tape-ink:#2A2206; --on-ink:#FFFFFF;
  --p1:#141A22; --p2:#E0392C; --p3:#F2C23E; --p4:#8A94A3;
  --sans:"Noto Sans HK","PingFang HK","Microsoft JhengHei",system-ui,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --ground:#0E1217; --paper:#161B22; --ink:#ECEFF3; --muted:#98A2AF; --line:#2B323C;
    --soft:#1C222A; --rec:#FF5B4D; --tape:#E8B936; --tape-ink:#231C04; --on-ink:#0E1217;
    --p1:#ECEFF3; --p2:#FF5B4D; --p3:#E8B936; --p4:#6D7785;
  }
}
:root[data-theme="dark"]{
  --ground:#0E1217; --paper:#161B22; --ink:#ECEFF3; --muted:#98A2AF; --line:#2B323C;
  --soft:#1C222A; --rec:#FF5B4D; --tape:#E8B936; --tape-ink:#231C04; --on-ink:#0E1217;
  --p1:#ECEFF3; --p2:#FF5B4D; --p3:#E8B936; --p4:#6D7785;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
img{max-width:100%}
[hidden]{display:none!important}
body{margin:0;background:var(--ground);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.65;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--rec);outline-offset:2px}
.mono{font-family:var(--mono);letter-spacing:.06em;text-transform:uppercase;font-size:12px}

/* top bar */
.top{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:14px clamp(16px,4vw,40px);border-bottom:1px solid var(--line);background:var(--paper)}
.topright{display:flex;align-items:center;gap:10px}
.install{border:1px solid var(--ink);background:var(--paper);border-radius:999px;padding:5px 14px;font-size:13px;font-weight:700;white-space:nowrap}
.logowrap{display:block;line-height:0}
.brand img.logo{height:26px;width:auto;display:block}
.brand img.ondark{display:none}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .brand img.onlight{display:none}:root:not([data-theme="light"]) .brand img.ondark{display:block}}
:root[data-theme="dark"] .brand img.onlight{display:none}
:root[data-theme="dark"] .brand img.ondark{display:block}
.brand .sep{padding-left:10px;margin-left:10px;border-left:1px solid var(--line);font-weight:700}
@media (max-width:420px){.brand .sep{display:none}}
@media (display-mode: standalone){.install{display:none}}
.brand .co{background:var(--ink);color:var(--on-ink);padding:1px 8px;border-radius:3px;font-family:var(--mono);letter-spacing:.08em}
.brand{display:flex;align-items:center;gap:10px;font-weight:900;font-size:17px;letter-spacing:.02em}
.recdot{width:10px;height:10px;border-radius:50%;background:var(--rec);box-shadow:0 0 0 4px color-mix(in srgb,var(--rec) 20%,transparent);animation:blink 1.4s steps(2,start) infinite}
@keyframes blink{to{opacity:.25}}
.steps{display:flex;gap:4px}
.steps span{padding:4px 10px;border-radius:3px;color:var(--muted)}
.steps span.on{background:var(--ink);color:var(--on-ink)}
.steps span.done{color:var(--ink)}
@media (max-width:620px){.steps{display:none}.top{padding:12px 16px}}
.brand{white-space:nowrap}

main{max-width:1120px;margin:0 auto;padding:clamp(24px,5vw,56px) clamp(16px,4vw,40px) 80px}
h1,h2,h3{text-wrap:balance;margin:0}
.eyebrow{color:var(--muted);margin-bottom:10px;display:block}
.lede{color:var(--muted);max-width:60ch;margin:12px 0 0}

/* industry */
.h-xl{font-size:clamp(30px,4.6vw,48px);font-weight:900;line-height:1.15;letter-spacing:.01em}
.h-xl em{font-style:normal;background:linear-gradient(transparent 62%,var(--tape) 62%);padding:0 .08em}
.grid-ind{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-top:32px}
@media (max-width:900px){.grid-ind{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (max-width:620px){.grid-ind{grid-template-columns:repeat(2,minmax(0,1fr))}}
.tile{text-align:left;background:var(--paper);border:1px solid var(--line);border-radius:6px;padding:18px;display:flex;flex-direction:column;gap:6px;min-height:118px;transition:border-color .15s,transform .15s}
.tile:hover{border-color:var(--ink);transform:translateY(-2px)}
.tile b{font-size:19px;font-weight:900}
.tile small{color:var(--muted);font-size:13px;line-height:1.5}
.tileacts{display:flex;gap:8px;margin-top:auto;padding-top:12px;flex-wrap:wrap}
.tileacts button{font-size:13px;font-weight:700;border-radius:4px;padding:6px 12px;border:1px solid var(--ink);background:var(--ink);color:var(--on-ink)}
.tileacts .demo{background:transparent;color:var(--ink)}
.tileacts .demo:hover{background:var(--soft)}

/* question */
.qwrap{max-width:760px;margin:0 auto}
.qhead{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:28px}
.pill{display:inline-flex;align-items:center;gap:8px;padding:5px 12px;border:1px solid var(--line);border-radius:999px;background:var(--paper);font-size:14px}
.pill b{font-weight:700}
.linkbtn{background:none;border:none;color:var(--muted);text-decoration:underline;text-underline-offset:3px;padding:4px}
.linkbtn:hover{color:var(--ink)}
.bar{height:4px;background:var(--line);border-radius:2px;overflow:hidden;margin-bottom:28px}
.bar i{display:block;height:100%;background:var(--rec);transition:width .3s}
.qtitle{font-size:clamp(26px,3.6vw,38px);font-weight:900;line-height:1.25}
.qhint{color:var(--muted);margin:8px 0 24px}
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:16px}
.field label{font-size:14px;font-weight:700}
input[type=text],textarea{width:100%;font:inherit;font-size:18px;color:var(--ink);background:var(--paper);border:1px solid var(--line);border-radius:6px;padding:14px 16px}
textarea{min-height:120px;resize:vertical;line-height:1.6}
input::placeholder,textarea::placeholder{color:var(--muted);opacity:.75}
input:focus,textarea:focus{outline:none;border-color:var(--ink)}
.chips{display:flex;flex-wrap:wrap;gap:10px}
.chip{border:1px solid var(--line);background:var(--paper);border-radius:999px;padding:10px 18px;font-size:16px;transition:background .12s}
.chip:hover{border-color:var(--ink)}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--on-ink);border-color:var(--ink)}
.chip small{opacity:.7;margin-left:6px;font-size:13px}
.qnav{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:36px}
.btn{border:1px solid var(--ink);background:var(--paper);border-radius:6px;padding:12px 22px;font-weight:700}
.btn.primary{background:var(--ink);color:var(--on-ink)}
.btn.rec{background:var(--rec);border-color:var(--rec);color:#fff}
.btn:disabled{opacity:.4;cursor:not-allowed}
.kbd{color:var(--muted);font-size:13px}

/* loading slate */
.slate{max-width:560px;margin:40px auto 0;background:var(--paper);border:1px solid var(--line);border-radius:8px;overflow:hidden}
.stripes{height:44px;background:repeating-linear-gradient(-45deg,var(--ink) 0 22px,var(--paper) 22px 44px);border-bottom:2px solid var(--ink);transform-origin:left bottom}
.slate.live .stripes{animation:clap 1.6s ease-in-out infinite}
@keyframes clap{0%,70%,100%{transform:rotate(0)}80%{transform:rotate(-9deg)}}
.slate-rows{display:grid;grid-template-columns:1fr 1fr}
.slate-rows div{padding:14px 18px;border-bottom:1px solid var(--line)}
.slate-rows div:nth-child(odd){border-right:1px solid var(--line)}
.slate-rows .full{grid-column:1/-1;border-right:none!important}
.slate-rows .mono{color:var(--muted);display:block;font-size:11px}
.slate-rows b{font-size:18px;font-weight:900}
.stage{padding:18px;display:flex;flex-direction:column;gap:6px}
.stage p{margin:0;color:var(--muted);display:flex;gap:10px;align-items:center}
.stage p.now{color:var(--ink);font-weight:700}
.stage p.ok{color:var(--ink)}
.stage p::before{content:"";width:8px;height:8px;border-radius:50%;border:1.5px solid currentColor;flex:none}
.stage p.ok::before{background:var(--ink)}
.stage p.now::before{background:var(--rec);border-color:var(--rec)}
.slate-foot{display:flex;justify-content:space-between;align-items:center;padding:12px 18px;background:var(--soft);font-variant-numeric:tabular-nums}

/* result */
.notice{display:flex;gap:12px;align-items:center;flex-wrap:wrap;justify-content:space-between;background:var(--paper);border:1px dashed var(--muted);border-radius:6px;padding:12px 16px;margin-bottom:24px;font-size:14px;color:var(--muted)}
.result{display:grid;grid-template-columns:330px minmax(0,1fr);gap:28px;align-items:start}
@media (max-width:900px){.result{grid-template-columns:1fr}}
.idcard{position:sticky;top:20px;background:var(--paper);border:2px solid var(--ink);border-radius:8px;overflow:hidden}
@media (max-width:900px){.idcard{position:static}}
.idcard .stripes{height:30px}
.idbody{padding:20px}
.idbody .mono{color:var(--muted);font-size:11px}
.ipname{font-size:30px;font-weight:900;line-height:1.2;margin:4px 0 10px}
.tagline{display:inline;background:var(--tape);color:var(--tape-ink);font-weight:700;padding:2px 6px;box-decoration-break:clone;-webkit-box-decoration-break:clone;line-height:1.9}
.kv{display:grid;grid-template-columns:62px 1fr;gap:8px 12px;margin-top:20px;padding-top:16px;border-top:1px solid var(--line);font-size:14px}
.kv dt{font-family:var(--mono);font-size:11px;letter-spacing:.06em;color:var(--muted);padding-top:3px}
.kv dd{margin:0}
.traits{display:flex;flex-wrap:wrap;gap:6px}
.traits span{border:1px solid var(--line);border-radius:3px;padding:1px 8px;font-size:13px}
.idactions{display:flex;flex-direction:column;gap:8px;padding:0 20px 20px}
.idactions .btn{width:100%}

.sec{background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:clamp(18px,3vw,28px);margin-bottom:18px}
.sec h3{font-size:22px;font-weight:900;margin-bottom:4px}
.sec .sub{color:var(--muted);font-size:14px;margin:0 0 18px}
.positioning{font-size:18px;line-height:1.8;margin:0 0 16px;max-width:62ch}
.pains{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px;margin:0;padding:0;list-style:none}
.pains li{background:var(--soft);border-radius:4px;padding:10px 12px;font-size:14px}
.pains li::before{content:"痛點";font-family:var(--mono);font-size:10px;color:var(--rec);display:block;letter-spacing:.08em}

.ratio{display:flex;height:34px;border-radius:4px;overflow:hidden;margin-bottom:18px}
.ratio div{display:flex;align-items:center;padding:0 10px;font-family:var(--mono);font-size:12px;font-weight:700;min-width:0;white-space:nowrap;overflow:hidden}
.pillars{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.pillar{border:1px solid var(--line);border-radius:6px;padding:14px 16px}
.pillar header{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.sw{width:12px;height:12px;border-radius:2px;flex:none}
.pillar header b{font-size:17px}
.pillar header .mono{margin-left:auto;color:var(--muted)}
.pillar p{margin:0 0 8px;font-size:14px;color:var(--muted)}
.pillar ul{margin:0;padding-left:18px;font-size:14px}

.filmgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-bottom:16px}
@media (max-width:620px){.filmgrid{grid-template-columns:1fr}}
.filmgrid div{background:var(--soft);border-radius:4px;padding:12px 14px}
.filmgrid .mono{color:var(--muted);font-size:11px;display:block}
.filmgrid b{font-size:15px}
.twocol{display:grid;grid-template-columns:1fr 1fr;gap:20px}
@media (max-width:620px){.twocol{grid-template-columns:1fr}}
.twocol h4{margin:0 0 6px;font-size:15px}
.twocol ul{margin:0;padding-left:18px;font-size:14px}

.board{display:flex;gap:14px;padding:16px;overflow-x:auto;scroll-snap-type:x proximity}
.frame{margin:0;flex:0 0 158px;display:flex;flex-direction:column;gap:8px;scroll-snap-align:start}
.screen{position:relative;aspect-ratio:9/16;border-radius:8px;background:var(--ink);overflow:hidden;
  background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);
  background-size:100% 33.33%,33.33% 100%;background-blend-mode:soft-light}
.screen .tc{position:absolute;top:8px;left:8px;font-family:var(--mono);font-size:10px;background:var(--rec);color:#fff;padding:1px 6px;border-radius:2px}
.screen .cam{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);font-family:var(--mono);font-size:10px;letter-spacing:.06em;color:rgba(255,255,255,.62);text-align:center;width:90%}
.screen .sub{position:absolute;left:6px;right:6px;bottom:10px;text-align:center;font-size:12px;font-weight:700;color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.9);line-height:1.4}
.frame figcaption{font-size:13px;color:var(--muted);display:flex;flex-direction:column;gap:3px}
.frame figcaption b{font-family:var(--mono);font-size:10px;letter-spacing:.06em;color:var(--ink)}
.frame figcaption em{font-style:normal;color:var(--ink)}
.brollh{margin:18px 0 8px;font-size:15px}
.broll{display:flex;flex-wrap:wrap;gap:8px}
.broll span{border:1px dashed var(--muted);border-radius:999px;padding:4px 12px;font-size:13px}
.titles{list-style:none;margin:16px 0 0;padding:0;display:grid;gap:10px}
.titles li{display:grid;grid-template-columns:32px 1fr;gap:12px;align-items:start;border-top:1px solid var(--line);padding-top:10px}
.titles .mono{color:var(--muted);padding-top:3px}
.titles b{font-size:16px}
.titles p{margin:2px 0 0;font-size:14px;color:var(--muted)}
.script{border:1px solid var(--line);border-radius:6px;margin-bottom:14px;overflow:hidden}
.script-head{padding:14px 16px;background:var(--soft);display:flex;flex-direction:column;gap:4px}
.script-head .mono{color:var(--muted);font-size:11px}
.script-head b{font-size:18px;font-weight:900}
.hook{font-size:15px}
.hook span{font-family:var(--mono);font-size:11px;background:var(--rec);color:#fff;padding:1px 6px;border-radius:2px;margin-right:8px;vertical-align:1px}
.tablewrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;min-width:520px;font-size:14px}
th{font-family:var(--mono);font-size:11px;letter-spacing:.06em;color:var(--muted);text-align:left;font-weight:500;padding:8px 16px;border-bottom:1px solid var(--line)}
td{padding:10px 16px;border-bottom:1px solid var(--line);vertical-align:top}
td.tc{font-family:var(--mono);font-size:12px;white-space:nowrap;font-variant-numeric:tabular-nums;color:var(--rec);font-weight:700}
tr:last-child td{border-bottom:none}
.cta-line{padding:10px 16px;border-top:1px solid var(--line);font-size:14px}
.cta-line b{margin-right:6px}

.funnel{list-style:none;margin:0;padding:0;counter-reset:f}
.funnel li{display:grid;grid-template-columns:44px 1fr;gap:14px;position:relative;padding-bottom:18px;counter-increment:f}
.funnel li:not(:last-child)::after{content:"";position:absolute;left:21px;top:40px;bottom:2px;width:2px;background:var(--line)}
.funnel .n{width:44px;height:44px;border-radius:50%;border:2px solid var(--ink);display:grid;place-items:center;font-family:var(--mono);font-weight:700;font-size:14px;background:var(--paper)}
.funnel li:last-child .n{background:var(--ink);color:var(--on-ink)}
.funnel b{display:block;font-size:17px;padding-top:8px}
.funnel p{margin:2px 0 0;font-size:14px;color:var(--muted)}
.magnet{margin-top:6px;display:flex;gap:14px;align-items:flex-start;background:var(--tape);color:var(--tape-ink);border-radius:6px;padding:14px 16px}
.magnet .mono{font-size:11px;opacity:.75;display:block}
.magnet b{font-size:17px}
.magnet p{margin:2px 0 0;font-size:14px}

.week{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.day{border:1px solid var(--line);border-radius:6px;padding:12px 14px}
.day .mono{font-size:11px;color:var(--muted)}
.day b{display:block;font-size:15px;margin:2px 0}
.day p{margin:0;font-size:13px;color:var(--muted)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;margin-top:16px}
.kpis div{border-top:2px solid var(--ink);padding-top:8px}
.kpis .mono{font-size:11px;color:var(--muted);display:block}
.kpis b{font-size:20px;font-weight:900;font-variant-numeric:tabular-nums}

.endcard{background:var(--ink);color:var(--on-ink);border-radius:8px;padding:clamp(20px,4vw,36px);display:flex;justify-content:space-between;align-items:center;gap:20px;flex-wrap:wrap}
.endcard h3{font-size:24px;font-weight:900}
.endcard p{margin:4px 0 0;opacity:.75;max-width:52ch}
.endcard .btn{background:var(--rec);border-color:var(--rec);color:#fff;text-decoration:none}
.endcard .btn.ghost{background:transparent;border-color:currentColor;color:var(--on-ink)}
.endbtns{display:flex;gap:10px;flex-wrap:wrap}
.side{border:1px solid var(--line);border-radius:6px;padding:14px 16px}
.side.jvm{border:2px solid var(--ink)}
.shootday{margin:14px 0 0;display:flex;gap:12px;align-items:baseline;flex-wrap:wrap;font-size:15px}
.shootday .mono{background:var(--tape);color:var(--tape-ink);padding:2px 8px;border-radius:3px;font-size:11px}
.shootday.note .mono{background:var(--rec);color:#fff}

.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:var(--on-ink);padding:10px 18px;border-radius:6px;font-size:14px;z-index:9}
.fade{animation:fade .35s ease both}
@keyframes fade{from{opacity:.001;transform:translateY(6px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

</head>
<body>
<header class="top">
  <div class="brand"><span class="recdot" aria-hidden="true"></span><span class="co" id="logo">JVM</span><span class="sep">IP 拍攝藍圖</span></div>
  <div class="topright">
  <button class="install" id="install" hidden>加到主畫面</button>
  <nav class="steps mono" id="steps" aria-label="進度">
    <span data-s="0">01 揀行業</span><span data-s="1">02 答問題</span><span data-s="2">03 IP 方案</span>
  </nav>
  </div>
</header>
<main id="app"></main>
<div class="toast" id="toast" hidden></div>

<script>
/* ---------- JVM 公司設定（改呢度就得） ---------- */
const JVM = {
  name: "JVM",
  logo: "brand/logo.png",           // 淺色底用（深色字）；留空就顯示文字 JVM
  logoLight: "brand/logo-light.png", // 深色底用（白字）
  brandColor: "",        // JVM 主色，例如 "#E0392C"；留空用預設紅色
  whatsapp: "85296347605",              // 國家碼 + 號碼，唔使 + 號；留空就唔顯示 WhatsApp 掣
  email: "Justvibingmedia8@gmail.com",  // 留空就唔顯示電郵掣
  process: [

/* ---------- 狀態 ---------- */
const S = {step:0, ind:null, q:0, a:{}, plan:null, mode:null, ctl:null, canRetry:false};
const $app = document.getElementById("app");
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const arr = v => Array.isArray(v) ? v : [];
const FRAMING = ["中近景 · 固定機位","特寫 · 手持","中景 · 慢推","中近景 · 固定機位","特寫 · 慢動作"];

function setSteps(){document.querySelectorAll("#steps span").forEach(s=>{const n=+s.dataset.s;s.className=n===S.step?"on":n<S.step?"done":""})}
function freshAnswers(){return {brand:"",desc:"",indText:"",audience:[],audienceCustom:"",usp:"",face:"",platforms:[],cta:"",freq:""}}

/* ---------- Step 2：問題 ---------- */
function renderQuestion(){
  S.step=1; setSteps();
  const Q = QUESTIONS[S.q], a=S.a, ind=S.ind, isOther=ind.id==="other";
  let body="";
  if(Q.type==="text"){
    body = `${isOther?`<div class="field"><label for="f-ind">你做邊一行？</label><input type="text" id="f-ind" value="${esc(a.indText)}" placeholder="例如：花店、會計師樓、汽車維修"></div>`:""}
      <div class="field"><label for="f-brand">品牌／店名</label><input type="text" id="f-brand" value="${esc(a.brand)}" placeholder="例如：${esc(ind.demo.brand||"你嘅品牌名")}"></div>
      <div class="field"><label for="f-desc">一句講你做緊乜</label><input type="text" id="f-desc" value="${esc(a.desc)}" placeholder="例如：${esc(ind.demo.desc||"喺邊區、做乜、主打咩")}"></div>`;
  } else if(Q.type==="textarea"){
    body = `<div class="field"><textarea id="f-usp" aria-label="${esc(Q.title)}" placeholder="例如：${esc(ind.demo.usp||"做咗15年、全人手製作、24小時內回覆")}">${esc(a.usp)}</textarea></div>`;
  } else {
    const cur = a[Q.key];
    body = `<div class="chips" role="group" aria-label="${esc(Q.title)}">${Q.options.map(o=>{
      const on = Q.type==="multi" ? cur.includes(o) : cur===o;
      return `<button class="chip" aria-pressed="${on}" data-v="${esc(o)}">${esc(o)}</button>`}).join("")}</div>
      ${Q.custom?`<div class="field" style="margin-top:16px"><label for="f-custom">補充（選填）</label><input type="text" id="f-custom" value="${esc(a.audienceCustom)}" placeholder="例如：30–45歲、住新界東、重視健康"></div>`:""}`;
  }
  const pct = Math.round((S.q)/QUESTIONS.length*100);
  $app.innerHTML = `<div class="qwrap fade">
    <div class="qhead">
      <span class="pill">行業 <b>${esc(ind.name)}</b> <button class="linkbtn" id="chg">更改</button></span>
      ${ind.demo.brand?`<button class="linkbtn" id="demo">填入示範答案</button>`:""}
    </div>
    <div class="bar" aria-hidden="true"><i style="width:${pct}%"></i></div>
    <span class="eyebrow mono">Q${S.q+1} / ${QUESTIONS.length}</span>
    <h2 class="qtitle">${esc(Q.title)}</h2>
    <p class="qhint">${esc(Q.hint)}</p>
    ${body}
    <div class="qnav">
      <button class="btn" id="back">← 上一步</button>
      <span class="kbd">按 Enter 繼續</span>
      <button class="btn ${S.q===QUESTIONS.length-1?"rec":"primary"}" id="next">${S.q===QUESTIONS.length-1?"生成 IP 方案":"下一步 →"}</button>
    </div></div>`;

  const bind=(id,k)=>{const el=document.getElementById(id); if(el) el.oninput=()=>{a[k]=el.value; validate()}};
  bind("f-ind","indText"); bind("f-brand","brand"); bind("f-desc","desc"); bind("f-usp","usp"); bind("f-custom","audienceCustom");
  $app.querySelectorAll(".chip").forEach(c=>c.onclick=()=>{
    const v=c.dataset.v;
    if(Q.type==="multi"){const i=a[Q.key].indexOf(v); i>=0?a[Q.key].splice(i,1):a[Q.key].push(v); c.setAttribute("aria-pressed",i<0)}
    else {a[Q.key]=v; $app.querySelectorAll(".chip").forEach(x=>x.setAttribute("aria-pressed",x===c)); setTimeout(next,180)}
    validate();
  });
  function validate(){
    const n=document.getElementById("next");
    if(Q.key==="brand") n.disabled = !a.brand.trim() || (isOther && !a.indText.trim());
  }
  function next(){
    if(document.getElementById("next").disabled) return;
    if(S.q<QUESTIONS.length-1){S.q++; renderQuestion()} else generate();
  }
  document.getElementById("next").onclick=next;
  document.getElementById("back").onclick=()=>{ if(S.q===0) renderIndustry(); else {S.q--; renderQuestion()} };
  document.getElementById("chg").onclick=renderIndustry;
  const d=document.getElementById("demo");
  if(d) d.onclick=()=>{
    Object.assign(a,{brand:ind.demo.brand,desc:ind.demo.desc,usp:ind.demo.usp,
      audience:a.audience.length?a.audience:["上班族"],face:a.face||"老闆本人",
      platforms:a.platforms.length?a.platforms:["Instagram Reels","小紅書"],cta:a.cta||"WhatsApp 查詢",freq:a.freq||"8 條（標準）"});
    S.q=QUESTIONS.length-1; renderQuestion(); toast("已填入示範答案");
  };
  $app.onkeydown=e=>{ if(e.key==="Enter" && e.target.tagName!=="TEXTAREA" && e.target.tagName!=="BUTTON"){e.preventDefault(); next()} };
  validate();
  const first=$app.querySelector("input,textarea"); if(first) first.focus({preventScroll:true});
}

/* ---------- Step 3：生成 ---------- */
const answerSummary = () => {
  const a=S.a, aud=[...a.audience, a.audienceCustom].filter(Boolean).join("、");
  return {
    industry: S.ind.id==="other" ? (a.indText||"其他") : S.ind.name,
    brand:a.brand, desc:a.desc||"（未填）", audience:aud||"一般大眾", usp:a.usp||"（未填）",
    face:a.face||"未諗好", platforms:a.platforms.join("、")||"Instagram Reels", cta:a.cta||"WhatsApp 查詢", freq:a.freq||"8 條（標準）"
  };
};
const freqCount = f => f.startsWith("4")?4 : f.startsWith("12")?12 : 8;

function renderLoading(){
  S.step=2; setSteps();
  const s=answerSummary();
  $app.innerHTML = `<div class="fade">
    <div class="slate live" id="slate">
      <div class="stripes" aria-hidden="true"></div>

      </div>
      <div class="stage" id="stage">
        ${["分析目標客痛點","設計 IP 人設同定位","規劃內容支柱","撰寫示範拍攝腳本","設計引流留客路徑"].map((t,i)=>`<p class="${i===0?"now":""}">${t}</p>`).join("")}
      </div>
      <div class="slate-foot"><span class="mono" id="count">AI 思考中…</span><button class="btn" id="stop">停止</button></div>
    </div></div>`;
  let i=0; const ps=[...document.querySelectorAll("#stage p")];
  S.stageTimer=setInterval(()=>{ if(i<ps.length-1){ps[i].className="ok"; i++; ps[i].className="now"} },7000);

function stopLoading(){clearInterval(S.stageTimer)}

async function generate(){
  renderLoading();
  S.ctl = new AbortController();
  document.getElementById("stop").onclick=()=>S.ctl.abort();
  let text="";
  try{
    const res = await fetch("api/generate", {
      method:"POST", headers:{"Content-Type":"application/json"}, signal:S.ctl.signal,
      body: JSON.stringify({...answerSummary()})
    });
    if(!res.ok || !res.body) throw {code: res.status===503 ? "not_configured" : "http_"+res.status};
    const reader=res.body.getReader(), dec=new TextDecoder();
    for(;;){
      const {done,value}=await reader.read(); if(done) break;
      text+=dec.decode(value,{stream:true});
      const c=document.getElementById("count"); if(c) c.textContent=`撰寫中 · ${text.length.toLocaleString()} 字`;
    }
    stopLoading();
    const m=text.match(/\{[\s\S]*\}/);
    const plan = m ? JSON.parse(m[0]) : null;
    if(!plan || !plan.ip_name || !arr(plan.pillars).length || !arr(plan.scripts).length) throw {code:"bad_shape"};
    showPlan(plan,"ai");
  }catch(e){
    stopLoading();
    if(e?.name==="AbortError"){ S.q=QUESTIONS.length-1; renderQuestion(); toast("已停止生成"); return }
    const why = (e?.code==="not_configured"||e?.code==="http_404"||e?.code==="http_405") ? "呢個係示範版（未接 AI），" : "AI 暫時未能回應，";
    S.canRetry = !["not_configured","http_404","http_405"].includes(e?.code);
    showPlan(buildFallback(),"fallback", why+"以下係按行業範本整理嘅方案。");
  }
}

/* ---------- 範本方案（冇 AI 時） ---------- */

      client_does: ["每月預留半日拍攝日","出鏡講你最熟悉嘅專業","提供場地、產品或客人個案（如有）"].concat(ind.extraTip?["確認 JVM 擬好嘅合規字眼"]:[]),
      note: ind.extraTip || "",

    },
    scripts: ind.scripts.map(sc=>({title:sc.title,hook:sc.hook,shots:sc.shots.map(([time,visual,voice],i)=>({time,visual,voice,framing:FRAMING[i%FRAMING.length]})),cta:`引導客人「${s.cta}」`})),
    shoot_list: {locations:sh.loc, props:sh.props, broll:sh.broll},

function planText(){
  const p=S.plan, s=answerSummary(), L=[];
  L.push(`【JVM × ${s.brand}｜IP 拍攝方案】（${s.industry}）`,`人設：${p.ip_name}`,`口號：${p.tagline}`,`定位：${p.positioning}`,`性格：${arr(p.traits).join("、")}`,`客人痛點：${arr(p.audience_pains).join("／")}`,"");
  L.push("■ 內容支柱"); arr(p.pillars).forEach(x=>L.push(`- ${x.name}（${x.ratio}%）：${x.desc}｜例：${arr(x.examples).join("、")}`)); L.push("");
  const f=p.production||{}; L.push("■ JVM 製作安排",`格式：${f.format}`,`片長：${f.length}`,`風格：${f.style}`,"JVM 負責：",...arr(f.jvm_does).map(t=>`- ${t}`),"你只需要：",...arr(f.client_does).map(t=>`- ${t}`),`拍攝日：${f.shoot_day||""}`,...(f.note?[`要注意：${f.note}`]:[]),"");
  arr(p.scripts).forEach((sc,i)=>{L.push(`■ 腳本 ${String.fromCharCode(65+i)}：${sc.title}`,`Hook：${sc.hook}`); arr(sc.shots).forEach((sh,n)=>L.push(`  鏡頭${n+1}｜${sh.time}｜${sh.framing||""}｜${sh.visual}｜${sh.voice}`)); if(sc.cta) L.push(`  CTA：${sc.cta}`); L.push("")});
  if(p.shoot_list){L.push("■ 拍攝日清單",`地點：${arr(p.shoot_list.locations).join("、")}`,`道具：${arr(p.shoot_list.props).join("、")}`,`B-roll：${arr(p.shoot_list.broll).join("、")}`,"")}
  if(arr(p.title_bank).length){L.push("■ 片題庫"); arr(p.title_bank).forEach((t,i)=>L.push(`${i+1}. ${t.title}｜Hook：${t.hook}`)); L.push("")}
  L.push("■ 引流留客路徑"); arr(p.funnel).forEach((x,i)=>L.push(`${i+1}. ${x.stage}：${x.action}`));
  if(p.lead_magnet) L.push(`留客誘因：${p.lead_magnet.name}——${p.lead_magnet.desc}`); L.push("");
  L.push("■ 第一個月發佈排程"); arr(p.schedule).forEach(d=>L.push(`${d.day}｜${d.pillar}｜${d.idea}`));
  L.push("","■ 首 30 日指標"); arr(p.kpis).forEach(k=>L.push(`- ${k.metric}：${k.target}`));
  L.push("","策劃、拍攝、剪接由 JVM 團隊負責。"+(JVM.whatsapp?` WhatsApp：+${JVM.whatsapp}`:"")+(JVM.email?` 電郵：${JVM.email}`:""));
  return L.join("\n");
}
async function copyPlan(){
  const t=planText();
  try{ await navigator.clipboard.writeText(t); toast("已複製成份方案") }
  catch(e){
    const ta=document.createElement("textarea"); ta.value=t; ta.style.position="fixed"; ta.style.opacity="0"; document.body.appendChild(ta); ta.select();
    try{ document.execCommand("copy"); toast("已複製成份方案") }catch(_){ toast("瀏覽器唔允許複製，請手動選取") }
    ta.remove();
  }
}

(function(){
  const btn=document.getElementById("install");
  const standalone = matchMedia("(display-mode: standalone)").matches || navigator.standalone;
  const isIOS = /iphone|ipad|ipod/i.test(navigator.userAgent) || (navigator.platform==="MacIntel" && navigator.maxTouchPoints>1);

  if("serviceWorker" in navigator && location.protocol!=="file:") navigator.serviceWorker.register("sw.js").catch(()=>{});
})();
